name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.4
          target: esp32s3
          path: '.'

      - name: Generate Merged Binary (0x0 Full Image)
        shell: bash
        run: |
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-mobile-firmware
          path: |
            build/merged-firmware.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/xiaozhi_esp32_mobile_clean.bin
            build/flasher_args.json
