name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.4
    steps:
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unpack and Prepare Sources
        shell: bash
        run: |
          if [ -f "source_code.zip" ]; then
            python3 -m zipfile -e source_code.zip .
          elif [ -f "src_bundle_clean.zip" ]; then
            python3 -m zipfile -e src_bundle_clean.zip .
          fi

          mkdir -p main
          echo 'dependencies:' > main/idf_component.yml
          echo '  lvgl/lvgl: "^8.3.11"' >> main/idf_component.yml
          echo '  espressif/esp_lcd_ili9341: "^1.1.0"' >> main/idf_component.yml
          echo '  espressif/esp_websocket_client: "^1.3.0"' >> main/idf_component.yml
          echo '  espressif/cjson: "^1.7.18"' >> main/idf_component.yml

          python3 -c '
          import os

          # 1. Patch display_manager.cc (Thêm hal/spi_ll.h lên đầu để tránh xung đột C++ operator, sửa mảng cảm ứng)
          p = "main/display/display_manager.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              if "hal/spi_ll.h" not in s: s = "#include \"hal/spi_ll.h\"\n" + s
              s = s.replace("uint8_t data_raw[4];", "uint8_t data_raw[5];")
              s = s.replace("i2c_master_read(cmd, data_raw, 4,", "i2c_master_read(cmd, data_raw, 5,")
              with open(p, "w") as f: f.write(s)

          # 2. Patch power_manager.cc (Sửa tên struct chuẩn adc_oneshot_unit_init_cfg_t của IDF v5)
          p = "main/peripherals/power_manager.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("adc_oneshot_unit_init_config_t", "adc_oneshot_unit_init_cfg_t")
              with open(p, "w") as f: f.write(s)

          # 3. Patch websocket_client.cc
          p = "main/net/websocket_client.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              if "<stdlib.h>" not in s: s = "#include <stdlib.h>\n#include <stdio.h>\n" + s
              if "esp_event.h" not in s: s = "#include \"esp_event.h\"\n" + s
              s = s.replace("const std::string& server_url", "const char* server_url")
              s = s.replace("ws_cfg.uri = server_url.c_str();", "ws_cfg.uri = server_url;")
              s = s.replace("(esp_websocket_event_id_t)", "")
              s = s.replace("WEBSOCKET_EVENT_ANY", "(esp_websocket_event_id_t)WEBSOCKET_EVENT_ANY")
              s = s.replace("(char*)pcm_buf", "(const char*)pcm_buf")
              with open(p, "w") as f: f.write(s)

          # 4. Patch websocket_client.h
          p = "main/net/websocket_client.h"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("const std::string& server_url", "const char* server_url")
              s = s.replace("#include <string>", "")
              with open(p, "w") as f: f.write(s)

          # 5. Patch wifi_manager.h
          p = "main/net/wifi_manager.h"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("std::string WifiManager_GetIp(void);", "const char* WifiManager_GetIp(void);")
              s = s.replace("std::string WifiManager_GetSsid(void);", "const char* WifiManager_GetSsid(void);")
              s = s.replace("std::string WifiManager_GetServerUrl(void);", "const char* WifiManager_GetServerUrl(void);")
              s = s.replace("void WifiManager_SetServerUrl(const std::string& url);", "void WifiManager_SetServerUrl(const char* url);")
              with open(p, "w") as f: f.write(s)

          # 6. Patch wifi_manager.cc
          p = "main/net/wifi_manager.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("std::string WifiManager_GetIp(void) { return s_ip_addr; }", "const char* WifiManager_GetIp(void) { return s_ip_addr.c_str(); }")
              s = s.replace("std::string WifiManager_GetSsid(void) { return s_ssid; }", "const char* WifiManager_GetSsid(void) { return s_ssid.c_str(); }")
              s = s.replace("std::string WifiManager_GetServerUrl(void) { return s_server_url; }", "const char* WifiManager_GetServerUrl(void) { return s_server_url.c_str(); }")
              s = s.replace("void WifiManager_SetServerUrl(const std::string& url) { s_server_url = url; }", "void WifiManager_SetServerUrl(const char* url) { if (url) s_server_url = url; }")
              with open(p, "w") as f: f.write(s)

          # 7. Patch main.cc
          p = "main/main.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("WifiManager_GetSsid().c_str()", "WifiManager_GetSsid()")
              s = s.replace("WifiManager_GetServerUrl().c_str()", "WifiManager_GetServerUrl()")
              with open(p, "w") as f: f.write(s)

          # 8. Clean CMakeLists.txt and add -Wno-error + -fpermissive
          p = "main/CMakeLists.txt"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              for c in ["esp_lcd_ili9341", "lvgl", "esp_websocket_client", "cjson", "json"]:
                  s = s.replace(c, "")
              if "WHOLE_ARCHIVE" not in s:
                  s = s.replace("nvs_flash", "nvs_flash\n    WHOLE_ARCHIVE")
              if "-Wno-error" not in s:
                  s += "\ntarget_compile_options(${COMPONENT_LIB} PRIVATE -Wno-error -Wno-missing-field-initializers -Wno-unused-variable -fpermissive)\n"
              with open(p, "w") as f: f.write(s)
          '

      - name: Build and Merge Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          if ! idf.py build; then
            echo "=========================================================="
            echo "=== CHI TIẾT LỖI TỪ STDOUT ==="
            echo "=========================================================="
            cat build/log/idf_py_stdout_output_* 2>/dev/null || true
            echo "=========================================================="
            echo "=== CHI TIẾT LỖI TỪ STDERR ==="
            echo "=========================================================="
            cat build/log/idf_py_stderr_output_* 2>/dev/null || true
            echo "=========================================================="
            echo "=== CHẠY NINJA TRỰC TIẾP ĐỂ THẤY LỖI ==="
            echo "=========================================================="
            ninja -C build || true
            exit 1
          fi

          cd build
          if [ -f "flash_project_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_project_args
          elif [ -f "flash_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args
          else
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x20000 xiaozhi_esp32_mobile_clean.bin
          fi

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-mobile-firmware
          path: |
            build/merged-firmware.bin
            build/xiaozhi_esp32_mobile_clean.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
