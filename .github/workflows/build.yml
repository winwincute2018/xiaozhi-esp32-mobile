name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.4
    steps:
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unpack Source Code
        shell: bash
        run: |
          if [ -f "source_code.zip" ]; then
            python3 -m zipfile -e source_code.zip .
          elif [ -f "src_bundle_clean.zip" ]; then
            python3 -m zipfile -e src_bundle_clean.zip .
          fi

          # Tự động đồng bộ các bản vá tương thích chuẩn C++ & ESP-IDF v5
          python3 -c '
          import os

          # 1. Bổ sung stdlib.h và sửa tham số WebSocketClient_Init
          if os.path.exists("main/net/websocket_client.cc"):
              with open("main/net/websocket_client.cc", "r") as f:
                  ws = f.read()
              if "<stdlib.h>" not in ws:
                  ws = "#include <stdlib.h>\n" + ws
              ws = ws.replace("const std::string& server_url", "const char* server_url")
              ws = ws.replace("ws_cfg.uri = server_url.c_str();", "ws_cfg.uri = server_url;")
              with open("main/net/websocket_client.cc", "w") as f:
                  f.write(ws)

          # 2. Sửa header websocket_client.h
          if os.path.exists("main/net/websocket_client.h"):
              with open("main/net/websocket_client.h", "r") as f:
                  wsh = f.read()
              wsh = wsh.replace("const std::string& server_url", "const char* server_url")
              with open("main/net/websocket_client.h", "w") as f:
                  f.write(wsh)

          # 3. Sửa lời gọi hàm trong main.cc
          if os.path.exists("main/main.cc"):
              with open("main/main.cc", "r") as f:
                  m = f.read()
              m = m.replace("WebSocketClient_Init(WifiManager_GetServerUrl());", "WebSocketClient_Init(WifiManager_GetServerUrl().c_str());")
              with open("main/main.cc", "w") as f:
                  f.write(m)

          # 4. Ghi đè cấu hình idf_component.yml chuẩn
          os.makedirs("main", exist_ok=True)
          with open("main/idf_component.yml", "w") as f:
              f.write("""dependencies:
  lvgl/lvgl: "^8.3.11"
  espressif/esp_lcd_ili9341: "^1.1.0"
  espressif/esp_websocket_client: "^1.3.0"
  espressif/cjson: "^1.7.18"
""")

          # 5. Làm sạch CMakeLists.txt REQUIRES để component manager tự quản lý
          if os.path.exists("main/CMakeLists.txt"):
              with open("main/CMakeLists.txt", "r") as f:
                  cm = f.read()
              cm = cm.replace("esp_lcd_ili9341", "")
              cm = cm.replace("lvgl", "")
              cm = cm.replace("esp_websocket_client", "")
              cm = cm.replace("cjson", "")
              cm = cm.replace("json", "")
              if "WHOLE_ARCHIVE" not in cm:
                  cm = cm.replace("nvs_flash", "nvs_flash\n    WHOLE_ARCHIVE")
              with open("main/CMakeLists.txt", "w") as f:
                  f.write(cm)
          '

      - name: Build and Merge Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          if ! idf.py build; then
            echo "=== XUẤT NHẬT KÝ LỖI BIÊN DỊCH (STDOUT) ==="
            tail -n 60 build/log/idf_py_stdout_output_* 2>/dev/null || true
            echo "=== XUẤT NHẬT KÝ LỖI BIÊN DỊCH (STDERR) ==="
            cat build/log/idf_py_stderr_output_* 2>/dev/null || true
            exit 1
          fi

          cd build
          if [ -f "flash_project_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_project_args
          elif [ -f "flash_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args
          else
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x20000 xiaozhi_esp32_mobile_clean.bin
          fi

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-mobile-firmware
          path: |
            build/merged-firmware.bin
            build/xiaozhi_esp32_mobile_clean.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
