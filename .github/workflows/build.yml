name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.4
    steps:
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unpack and Prepare Sources
        shell: bash
        run: |
          if [ -f "source_code.zip" ]; then
            python3 -m zipfile -e source_code.zip .
          elif [ -f "src_bundle_clean.zip" ]; then
            python3 -m zipfile -e src_bundle_clean.zip .
          fi

          mkdir -p main
          echo 'dependencies:' > main/idf_component.yml
          echo '  lvgl/lvgl: "^8.3.11"' >> main/idf_component.yml
          echo '  espressif/esp_lcd_ili9341: "^1.1.0"' >> main/idf_component.yml
          echo '  espressif/esp_websocket_client: "^1.3.0"' >> main/idf_component.yml
          echo '  espressif/cjson: "^1.7.18"' >> main/idf_component.yml

          python3 -c '
          import os

          # 1. Patch websocket_client.cc
          p = "main/net/websocket_client.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              if "<stdlib.h>" not in s: s = "#include <stdlib.h>\n#include <stdio.h>\n" + s
              s = s.replace("const std::string& server_url", "const char* server_url")
              s = s.replace("ws_cfg.uri = server_url.c_str();", "ws_cfg.uri = server_url;")
              with open(p, "w") as f: f.write(s)

          # 2. Patch websocket_client.h
          p = "main/net/websocket_client.h"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("const std::string& server_url", "const char* server_url")
              with open(p, "w") as f: f.write(s)

          # 3. Patch main.cc
          p = "main/main.cc"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              s = s.replace("WebSocketClient_Init(WifiManager_GetServerUrl());", "WebSocketClient_Init(WifiManager_GetServerUrl().c_str());")
              with open(p, "w") as f: f.write(s)

          # 4. Clean CMakeLists.txt
          p = "main/CMakeLists.txt"
          if os.path.exists(p):
              with open(p, "r") as f: s = f.read()
              for c in ["esp_lcd_ili9341", "lvgl", "esp_websocket_client", "cjson", "json"]:
                  s = s.replace(c, "")
              if "WHOLE_ARCHIVE" not in s:
                  s = s.replace("nvs_flash", "nvs_flash\n    WHOLE_ARCHIVE")
              with open(p, "w") as f: f.write(s)
          '

      - name: Build and Merge Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          if ! idf.py build; then
            echo "=== XUẤT NHẬT KÝ LỖI BIÊN DỊCH (STDOUT) ==="
            tail -n 60 build/log/idf_py_stdout_output_* 2>/dev/null || true
            echo "=== XUẤT NHẬT KÝ LỖI BIÊN DỊCH (STDERR) ==="
            cat build/log/idf_py_stderr_output_* 2>/dev/null || true
            exit 1
          fi

          cd build
          if [ -f "flash_project_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_project_args
          elif [ -f "flash_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args
          else
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x20000 xiaozhi_esp32_mobile_clean.bin
          fi

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-mobile-firmware
          path: |
            build/merged-firmware.bin
            build/xiaozhi_esp32_mobile_clean.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
