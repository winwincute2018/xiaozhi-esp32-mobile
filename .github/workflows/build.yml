name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.4
    steps:
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Full Source Code
        shell: bash
        run: |
          python3 -c '
          import base64, io, zipfile
          b64 = """"""
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(b64))) as z:
              z.extractall(".")
          '

      - name: Build and Merge Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          cd build
          if [ -f "flash_project_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_project_args
          elif [ -f "flash_args" ]; then
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args
          else
            esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0x20000 xiaozhi_esp32_mobile_clean.bin
          fi

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-mobile-firmware
          path: |
            build/merged-firmware.bin
            build/xiaozhi_esp32_mobile_clean.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
